name: CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build backend
        working-directory: backend/springboot
        run: mvn -DskipTests package

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install frontend deps
        working-directory: frontend-angular
        run: npm ci

      - name: Run frontend unit tests (headless)
        working-directory: frontend-angular
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable
        run: npm run test:ci --silent
name: CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up venv and install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        env:
          XFCS__ARCHIVES_ROOT: ${{ github.workspace }}/mock/archives
          XFCS__DATA_ROOT: ${{ github.workspace }}/mock/data
          XFCS__ENVS_CONFIG: ${{ github.workspace }}/mock/mock_env.conf
        run: |
          . .venv/bin/activate
          pytest -q

  frontend:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        run: |
          npm ci
          npm run build
