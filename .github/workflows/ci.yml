name: CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  backend-maven:
    name: Backend - Maven build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and run backend tests (includes integration)
        working-directory: backend/springboot
        env:
          SPRING_PROFILES_ACTIVE: dev
        run: mvn -B test package

  frontend-tests:
    name: Frontend - npm install & headless tests
    runs-on: ubuntu-latest
    needs: backend-maven
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Cache frontend node_modules (fallback)
        uses: actions/cache@v4
        with:
          path: frontend-angular/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend-angular/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install frontend deps
        working-directory: frontend-angular
        run: npm ci

      - name: Run frontend unit tests (headless)
        working-directory: frontend-angular
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable
        run: npm run test:ci --silent
name: CI

