[project]
name = "xfcs-dearchiver-backend"
version = "0.1.0"
description = "FastAPI backend for xfcs-dearchiver"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "httpx==0.27.2",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [
    ".",
]
